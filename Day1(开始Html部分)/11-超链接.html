<!-- 超链接：点击跳转到其他页面 -->
<!-- <a href="目标地址" target="">跳转到xxx</a> -->
<!-- href属性是跳转地址，是超链接的必须属性 #表示空连接-->
<!-- target可以设置链接打开的形式-->
 <!-- _blank表示新页面打开 -->
 <!-- _parent表示在父级框架（iframe）中打开连接 -->
 <!-- _top表示在最顶层窗口中打开连接 -->
 <!-- _self表示在最顶层窗口中打开连接（跳出所有iframe框架） -->


<!-- 地址也可以是本地链接 -->




<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超链接</title>
</head>
<body>
    <a href="https://www.csust.edu.cn/" target="_blank">跳转到长沙理工大学官网</a>
    <br>
    <a href="/Images/01.jpg">打开我的头像</a>
    <br>
    <a href="#">空连接</a>

</body>
</html>
