<!--
<audio src="音频的URL"></audio>  支持MP3,Ogg,Wav
常见属性：
controls：显示音频控制面板
loop：循环播放
autoplay：自动播放，为了提升用户体验，一般会禁用自动播放功能
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频</title>
</head>
<body>
    <!-- 在HTML5中，
     如果如果属性名和属性完全一样，可以简写为一个单词 -->
    <audio src="./audio/audio1.m4a" controls="controls" autoplay></audio>    
</body>
</html>
