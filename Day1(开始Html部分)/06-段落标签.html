
<!-- 段落标签： -->
<!-- 标签名：P（双标签） -->
<!-- 显示特点：独占一行，段落之间存在空白间隙 -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>段落标签是个双标签</p>
    <p>段落标签独占一行,段落之间存在空白间隙,并前显示会自动适应</p>

</body>
</html>
