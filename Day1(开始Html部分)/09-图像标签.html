<!--  <img src = "图片的URL">  -->
<!-- src用于指定图像的位置和名称，是<img>的必须属性 -->
 <!--  
如果图片加载失败（网络慢、路径错误、图片被删除等），
浏览器会显示 alt 里的文字，告诉用户这张图大概是什么内容。
无障碍访问（屏幕阅读器）
 -->
<!--
alt:图片无法显示的时候显示的文字
title：鼠标悬停在图片上的时候显示的文字

width：图片的宽度，值位数字，没有单位
height：图片的高度，值为数字，没有单位
不过实际工作时候，最好通过css来设置
!-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像基本使用</title>
</head>
<body>
        <img src="Images/01.jpg" alt="这是我的头像" title="这是图片的标题" height="88",width="88">
</body>
</html>
