<!-- 
常见属性：
controls：控制面板
loop:循环播放
muted:静音
autoplay:视频自动播放，并且必须静音状态
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频</title>
</head>
<body>
    <video src="./videos/video1.mp4" controls autoplay></video>
</body>
</html>
