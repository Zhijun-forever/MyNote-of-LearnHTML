<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻列表</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        li{
            list-style: none;
        }

        a{
            text-decoration: none;
        }

        .news{
            margin: 100px auto;
            width: 360px;
            height: 200px;
            background-color: pink;
        }

        .news .hd{
            height: 34px;
            background-color:#eee;
            border:1px solid #dbdee1;
            /* 左边无边框线 */
            border-left: 0;
        }
        .news .hd a{
            margin: -1px;
            display:block;
            border-top: 3px #ff8400 solid;
            border-right: 1px solid #dbdee1;
            width: 48px;
            height: 34px;
            background-color: #fff;
            
            
            text-align: center;
            line-height: 30px;
            font-size: 14px;
            color: #333;
        }

        .news .bd{
            padding: 5px;
            background-color: #fff;
        }

        .news .bd li{
            background-image:url(../Images/Day5-综合案例二-小黄点.png) ;
            background-repeat: no-repeat;
            background-position: 0 center;
            padding-left: 15px;
        }

        .news .bd li a{
            background-image: url(../Images/Day5-综合案例二-图片.png);
            background-repeat: no-repeat;
            background-position: 0 center;
            padding-left: 20px;

            font-size: 12px;
            line-height: 26px;
            color: #666;


        }

        .news .bd li a:hover{
            color: #ff8400;
        }

    </style>
</head>
<body>
    <!-- 新闻区域 包含 标题 + 内容 -->
    <div class="news">
        <div class="hd">
            <a href="#">新闻</a>
        </div>
        <div class="bd">
            <ul>
                <li><a href="#">点赞"新农人"温暖的伸手</a></li>
                <li><a href="#">在希望的田野上</a></li>
                <li><a href="#">“中国天眼”又有新发现已在《自然》杂志发表</a></li>
                <li><a href="#">急！这个领域，缺人！月薪四万还不好招！啥情况？</a></li>
                <li><a href="#">G9“带货”背后：亏损持续扩大，竞争环境激烈</a></li>
                <li><a href="#">多地推动二手房“带押过户”，有什么好处？</a></li>
            </ul>
        </div>


    </div>


</body>
</html>
