<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        //自增 和 自减
        let num = 1;
        num++; // 等价于 num = num + 1
        console.log(num);

        //注意，num++和++num是不一样的
        //num++是先使用num再++
        let num2 = 0;
        console.log(num2++);

        //++num 是先让num++再使用num
        let num3 = 0;
        console.log(++num3);


    </script>
</body>
</html>
