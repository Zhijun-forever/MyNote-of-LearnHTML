<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function fn(x = 0,y = 0){
            x = x || 0;
            y = y || 0;

            console.log(x + y);
        }
        fn(1,2);

        
        /**
         * 逻辑运算符 && 一旦发现前面为假，则后边的语句不再执行 
         *           || 一旦发现前面为真，则后边的语句不在执行               
         * 
         *
         * 
        */
    </script>
</body>
</html>
