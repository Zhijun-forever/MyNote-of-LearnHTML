<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function arrayGetSum(arr = []){
            let sum = 0;
            for(let i = 0 ;i<arr.length;i++){
                sum += arr[i];
            }
            return sum;
        }

        arr = [10,11,45,34];

        document.write("数组的和是：" + arrayGetSum(arr));

    </script>
</body>
</html>
