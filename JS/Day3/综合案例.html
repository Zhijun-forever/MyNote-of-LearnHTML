<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合案例</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .box{
            display: flex;
            width: 700px;
            height: 300px;
            border-left: 1px solid pink;
            border-bottom: 1px solid pink;
            margin: 50% 25%;
            justify-content: space-around;
            align-items: flex-end;
            text-align: center;

        }

        .box>div{
            display: flex;
            width: 50px;
            background-color: pink;
            flex-direction: column;
            justify-content: space-between;
        }


        .box div span{
            margin-top: -20px;
        }

        .box div h4{
            margin-bottom: -35px;
            width: 70px;
            margin-left: -10px;
        }


    </style>

</head>
<body>
    
<script>

    let array = new Array();
    for(let i = 0 ;i<4 ;i++){
        array.push(prompt(`请输入第${i+1}季度的数据`));
    }

    document.write(`
        <div class="box">
        <div style="height: ${array[0]}px;">
            <span style="height: ${array[0]}px;">${array[0]}</span>
            <h4>第一季度</h4>
        </div>

        <div style="height: ${array[1]}px;">
            <span>${array[1]}</span>
            <h4>第二季度</h4>
        </div>

        <div style="height:${array[2]}px;">
            <span>${array[2]}</span>
            <h4>第三季度</h4>
        </div>

        <div style="height:${array[3]}px;">
            <span>${array[3]}</span>
            <h4>第四季度</h4>
        </div>
    </div>
    `)

    array.sort(function(a,b){
        return 



    })

</script>

</body>
</html>
