<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数组基础演示</title>
</head>
<body>
    <script>
        // ===== 1. 数字数组 =====
        //arr.join(分隔符) 把数组的每个元素用分隔符拼成一个字符串。
        let arr = [1, 2, 3, 4, 5];
        console.log(arr);                                    // [1, 2, 3, 4, 5]
        document.write("数组arr的长度是：" + arr.length + "<br>");
        document.write("数组arr内容：[" + arr.join(", ") + "]<br><br>");

        // ===== 2. 混合类型数组 =====
        let arr2 = ["str", 0, { name: "Tom" }, true];        // object → 对象字面量
        console.log(arr2);
        document.write("数组arr2的长度是：" + arr2.length + "<br>");
        document.write("数组arr2内容：" + arr2.join(" | ") + "<br>");

        // 也可以显式写字符串 "object" 来演示"元素可以是任意类型"
        let arr3 = ["str", 0, "object", true];
        console.log("arr3 =", arr3);

        // ===== JS 数组的特点 =====
        // 1. 数组长度可变
        let arr4 = [1, 2];
        arr4[4] = 5;                 // 跳过索引 2、3，中间自动填 undefined
        console.log("长度可变：", arr4, "长度 =", arr4.length);  // [1,2,undefined,undefined,5] 长度 5

        arr4.length = 2;             // 直接截断
        console.log("截断后：", arr4, "长度 =", arr4.length);    // [1,2] 长度 2

        // 2. 元素可以是任意类型（数字、字符串、布尔、对象、数组、函数、null、undefined）
        let arr5 = [1, "a", true, null, undefined, { x: 1 }, [1, 2], function () {}];
        console.log("任意类型：", arr5);
    </script>
</body>
</html>
