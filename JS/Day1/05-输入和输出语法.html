<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="./相关图片/JS输入输出语法.png" alt="Image" style="width: 600px; height: 300px;">

   
    <script>
        document.write("<h1>输入和输出语法</h1>")
        document.write("<p>JavaScript 提供了多种方法来进行输入和输出操作。</p>")
        document.write("<h2>输出方法</h2>")
        document.write("<p>1. 使用 document.write() 方法可以将内容直接写入 HTML 文档中。例如：</p>")
        document.write("<pre><code>document.write('Hello, World!');</code></pre>")
        document.write("<p>2. 使用 console.log() 方法可以将内容输出到浏览器的控制台中。例如：</p>")
        document.write("<pre><code>console.log('Hello, World!');</code></pre>")
        document.write("<h2>输入方法</h2>")
        document.write("<p>1. 使用 prompt() 方法可以弹出一个对话框，提示用户输入信息。例如：</p>")
        document.write("<pre><code>var name = prompt('请输入您的名字:');</code></pre>")
        document.write("<p>2. 使用 confirm() 方法可以弹出一个对话框 ，提示用户确认操作。例如：</p>")
        document.write("<pre><code>var isConfirmed = confirm('您确定要继续吗?');</code></pre>")
        document.write("<p>3. 使用 alert() 方法可以弹出一个对话框，显示信息给用户。例如：</p>")
        document.write("<pre><code>alert('操作成功!');</code></pre>")


        console.log("这是一个输出到控制台的示例。");

        prompt("请输入您的名字：")
        confirm("您确定要继续吗？")



        document.write("alert和prompt会优先渲染，confirm会在alert和prompt之后渲染。")

    </script>
</body>
</html>
