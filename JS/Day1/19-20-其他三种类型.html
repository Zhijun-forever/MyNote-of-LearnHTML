<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //其他三种类型
        //1.布尔类型
        let flag = true;
        console.log(flag);
        console.log(typeof flag);

        //2.null类型
        let n = null;
        console.log(n);
        console.log(typeof n);

        //3.undefined类型
        let u;
        console.log(u);
        console.log(typeof u);
        console.log(u + 1); //undefined类型参与运算，结果为NaN


    </script>
</body>
</html>
