<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2{
            text-align: center;
        }

        table{
            border-collapse: collapse;
            margin: 0 auto;
            text-align: center;
        }

    </style>

</head>
<body>
    <h2>订单确认</h2>
    <script>
        let goodsName = +prompt("请输入商品名称：");
        let goodsPrice = +prompt("请输入商品价格：");
        let goodsNum = +prompt("请输入商品数量：");
        let total = goodsPrice * goodsNum;
        let address = prompt("请输入送货地址：");

        document.write(`
        <table border="1">
                <tr>
                    <th>商品名称</th>
                    <th>商品价格</th>
                    <th>商品数量</th>
                    <th>总价</th>
                    <th>送货地址</th>
                </tr>

                <tr>
                    <td>${goodsName}</td>
                    <td>${goodsPrice}元</td>
                    <td>${goodsNum}</td>
                    <td>${total}元</td>
                    <td>${address}</td>
                </tr>

            </table>
        
        `)
    </script>

</body>
</html>
