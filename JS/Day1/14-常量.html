<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    
        // ===== 1. 常量的特点 =====
        // 1. 常量必须在声明时初始化
        //const MAX; 这句会报错，因为常量必须在声明时初始化

        // 2. 常量的值不能被修改
         const PI = 3.14159;
        //PI = 2; 这样会报错，因为 PI 是常量，不能被重新赋值
        document.write("PI = " + PI + "<br>");
        console.log("PI = " + PI);

    </script>
</body>
</html>
