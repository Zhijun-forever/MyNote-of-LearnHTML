<!-- 
1.修改常用属性
    语法：对象.属性 = 值

2.修改元素样式属性
    语法：对象.style = '值'
          元素.className = '类名' 这个会直接覆盖之前的类名
          元素.classList.add('类名')  这个不会覆盖之前的类名
          元素.classList.remove('类名') 这个可以删除类
          元素.toggle('类名') 切换类，有则删除，无则添加


3.修改表单元素属性(比如点击显示密码本质上是把表单类型改为文本框)
    获取：DOM对象.属性名
    设置：DOM对象.属性名 = 新值

4.修改自定义属性
    html5中专门推出了data-自定义属性
    标签上一律以data-开头
    在DOM对象上一律以dataset对象方式获取

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 400px;
            height: 200px;
            background-color: pink;
        }

        .div2{
            width: 200px;
            height: 200px;
            background-color: pink;
            border: 2px solid seagreen;
        }
        .addition{
            padding: 20px;
        }
    </style>
</head>
<body>
    <img src="../../../Images/01.jpg" alt="" class="img1">
    <img src="../../../Images/deepseek.png" alt="" class="img1">

    <div data-id="0" data-xxx="xxx" class="box"></div>
    <div data-id="1">1</div>
    <div data-id="2">2</div>
    <div data-id="3">3</div>
    <div data-id="4">4</div>

    <input type="text" name="" id="" value="" placeholder="请输入">

    <input class="checkbox" type="checkbox" name="" id="" checked="false">

    <input type="button" name="" id="" disabled="disabled">

    
    
<script>
    //1.获取图片元素
    const img = document.querySelector('img');
    
    //修改属性
    img.src = "../../../Images/deepseek.png"
    img.title = 'deepseekLogo'



    //-----------点击刷新按钮获取随机图像的案例：（只是案例，我这里没有图片）-----------
    //取到N-M的随机数
    function getRandom(N,M){
        return Math.floor(Math.random() * (M - N + 1)) + N;
    }

    //1.获取图片对象
    // const img2 = document.querySelector('img2')

    //2.随机取得序号
    // const random = getRandom(1,6);
    // img2.src = `./../../Images/${random}.png`

    //----------修改元素样式-------------------
    
    //1.获取元素
    const box = document.querySelector('.box');
    //2.修改元素样式
    box.style.width = '500px';
    //多组单词需要使用小驼峰命名法
    box.style.backgroundColor = 'orange';
    box.style.border = '5px solid green';
    box.style.marginTop = '15px'

    //通过修改类名修改样式
    //这个地方不会生效因为内联样式的优先级最高
    box.className = 'div2';

    //通过元素.classList.add('类名')追加元素
    box.classList.add('addition');


    //---------修改表单内容----------
    const uname = document.querySelector('input');
    // console.log(uname.value); 但是innerHTML无法获得值

    //设置表单的值
    uname.value = "通过js获取表单的值";

    //设置表单类型为密码
    uname.type = 'password';

    //设置
    const checkbox = document.querySelector('.checkbox');
    console.log(checkbox.checked);  //false
    checkbox.checked = true;
    

    //---------修改自定义属性-------------
    const one = document.querySelector('div');
    console.log(one.dataset)
    console.log(one.dataset.xxx);
    


     
    






</script>
</body>
</html>
