<!-- 
定时器：间歇函数：能够使用定时器函数重复执行代码
定时器可以开始和关闭定时器

1.开启定时器
    setInterval(函数，间隔时间（ms）)
    定时器返回一个id数字，因为页面中不只有一个定时器

2.关闭定时器
    let 变量名 = setInterval(函数，间隔时间);
    clearInterval(变量名);

-->
