test() 方法  用来查看正则表达式与指定字符串是否匹配

regObj.test(被检查的字符串)  返回一个Boolean类型


检索符合规则的字符串：
regObj.exec(被检测的字符串)    返回一个数组





-->

<html lang="en">

  <title>Document</title>
</head>

<body>
  <script>
    const str = '我们在学习前端，希望学习前端能高薪毕业'
    // 正则表达式使用：
    // 1. 定义规则
    const reg = /前端/
    // 2. 是否匹配
    // console.log(reg.test(str))  // true

    console.log(reg.exec(str))  // 返回数组
