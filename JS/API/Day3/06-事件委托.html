<!-- 
时间委托是利用事件流的特征解决一些开发需求的知识技巧：


优点：减少注册次数，可以提高程序性能

原理：事件委托其实是利用事件冒泡的特点
     给父元素注册事件，当我们触发子元素是会冒泡到父元素上，从而触发父元素的事件


实现：事件对象.target.tagName可以获得真正触发事件的元素



-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul>
        <li>第1个孩子</li>
        <li>第2个孩子</li>
        <li>第3个孩子</li>
        <li>第4个孩子</li>
        <li>第5个孩子</li>
        <p>这个点击不要变红色</p>
    </ul>


<script>
    const ul = document.querySelector('ul');
    ul.addEventListener('click',function(e){
        console.dir(e.target);  //这个可以拿到我们刚刚点击的对象
        console.log(e);
        if(e.target.tagName === 'LI'){
            e.target.style.color = 'red';
        }
        
    })
    
</script>
</body>
</html>
