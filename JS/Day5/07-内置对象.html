<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内置对象</title>
</head>
<body>
    


    <script>
        /**     内置对象：JS内部提供的对象，共给开发者使用
         * 
         *      比如：console.log(),document.write()
         * 
         *      内置对象-Math
         *          random：生成0-1之间的随机数
         *          ceil：向上取整
         *          floor：向下取整
         *          round:四舍五入
         *          max:找最大数
         *          min:找最小数
         *          pow:幂运算
         *          abs:绝对值
         *          ......
         **/ 



         //向上取整：5
         console.log(Math.ceil(4.8));

         //向下取整: 4
         console.log(Math.floor(4.8));
         
         //四舍五入：5
         console.log(Math.round(4.8));
         
         
    </script>
</body>
</html>
