<!-- 
透明度opacity

作用：设置整个元素的透明度（包含背景和内容）
属性名：opacity

属性值：
0：完全透明（元素不可见）
1：不透明
0-1之间的小数：半透明

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>透明度opacity</title>
    <style>
        div{
            width: 600px;
            height: 600px;
            background-color: black;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div>
        <img src="../Images/01.jpg" alt="">
    </div>
</body>
</html>
