<!-- 
光标类型cursor：
作用：鼠标悬停在元素上时指针的显示样式
属性名：cursor
属性值          效果
default         默认值，通常时箭头
pointer         小手效果，提示用户可以点击
text            工字形，提示用户可以选择文字
move            十字光标，提示用户可以移动 
-->

            width: 200px;

        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
