<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合案例2</title>
</head>
<body>
    <h1>注册信息</h1>
    <form action="">
        <h3>个人信息</h3>
        <label>姓名:<input type="text" placeholder="请真实输入姓名"></label>
        <br>
        <label> 密码: <input type="password" placeholder="请输入密码"></label>
        <br>
        <label>确认密码: <input type="password" placeholder="请再次输入密码"></label>
        <br>

        <label>男<input type="radio" name="gender" checked>&nbsp;</label>
        <label>女<input type="radio" name="gender"></label>

        <br>
        <label>居住城市:
            <select>
            <option selected>北京</option>
            <option>上海</option>
            <option>广东</option>
            <option>深圳</option>
            <option>长沙</option>
        </select>
        </label>
       
        <br>
        <h3>教育经历</h3>

        <label>最高学历
            <select>
                <option>博士</option>
                <option>硕士</option>
                <option>本科</option>
                <option>专科</option>
                <option>高中</option>
                <option>初中</option>
                <option>小学</option>
                <option>无</option>
            </select>
        </label>
        
        <br>
        <label>学校名称: <input type="text" name="" id="" placeholder="请输入学校名称"></label>
        <br>
        <label>所学专业: <input type="text" name="" id="" placeholder="请输入所学专业名称"></label>
        <br>
        <label>在校时间:
            <select>
                <option>2021</option>
                <option>2022</option>
                <option>2023</option>
                <option>2024</option>
                <option>2025</option>
                <option>2026</option>
            </select>
            --
            <select>
                <option>2025</option>
                <option>2026</option>
                <option>2027</option>
                <option>2028</option>
                <option>2029</option>
                <option>2030</option>
            </select>
        </label>

        <h3>工作经历</h3>
        <label>公司名称: <input type="text" placeholder="请输入公司名称"></label>
        <br>
        <label>工作描述:
            <br>
            <textarea placeholder="请输入工作描述,承担那些方面的工作以及相关经验" cols="45" rows="8"></textarea>
            <br>
        </label>
        <br>
        <label><input type="checkbox">已阅读并同意以下协议</label>

        <br>
        <ul>
            <li><a href="https://agree.xiaohongshu.com/h5/terms/ZXXY20220331001/-1" target="_blank">《用户服务协议》</a></li>
            <li><a href="https://agree.xiaohongshu.com/h5/terms/ZXXY20220509001/-1" target="_blank">《在线协议》</a></li>
        </ul>
        <br>
        <br>

        <button type="submit">免费注册</button>
        <button type="reset">重新填写</button>

    </form>

</body>
</html>
