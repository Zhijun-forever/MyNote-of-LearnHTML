<!-- 多行输入文本的表单控件，比如评论编辑区 -->

<!-- 标签:textarea -->
<!-- <textarea name="" id="" cols="30" rows="10"></textarea> -->
<!-- name和id都是给后端通信用的，目前用不到，clow和rows是设置大小，一般用css设置 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本域</title>
</head>
<body>
    <!-- 文本域右下角有拖拽功能，一般把他禁用 -->
    <textarea name="" id="" cols="30" rows="10">请输入评论</textarea>
</body>
</html>
