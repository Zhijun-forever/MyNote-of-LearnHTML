<!-- 在网页中显示预留字符 跟转义字符类似 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字符实体</title>
</head>
<body>
    <!-- &nbsp;表示空格 -->
    东隅已逝&nbsp;&nbsp;&nbsp;桑榆非晚
    <br>
    <!-- &lt;表示小于符号,&gt;表示大于符号 -->
    &lt;悟已往之不谏，知来者可追&gt;
</body>
</html>
