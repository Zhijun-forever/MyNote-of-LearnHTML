

<!-- 列表分类：无序列表，有序列表，定义列表 -->
<!--  
无序列表：
作用：当列表项的顺序不重要时，使用无序列表。
语法：使用 <ul> 标签定义无序列表，使用 <li> 标签定义列表项。
示例：
<ul>
  <li>苹果</li>
  <li>香蕉</li>
  <li>橙子</li>
</ul>
ul标签只能包裹li标签，但是li标签里面可以包裹任何内容


有序列表：
作用：当列表项的顺序重要时，使用有序列表。
语法：使用 <ol> 标签定义有序列表，使用 <li> 标签定义列表项。
示例：
<ol>
  <li>第一步</li>
  <li>第二步</li>
  <li>第三步</li>
</ol>


定义列表：
作用：用于定义术语和描述。
语法：dl嵌套dt和dd，dl是定义列表，dt是定义列表的标题，dd是定义列表的详情
示例：
<dl>
  <dt>列表标题</dt>
  <dd>列表详情</dd>
  ......
</dl>

-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>列表</title>
</head>
<body>
    <ul>
        <li>无序列表条目一</li>
        <li>无序列表条目二</li>
        <li>无序列表条目三</li>
    </ul>

    <ol>
        <li>有序列表条目一</li>
        <li>有序列表条目二</li>
        <li>有序列表条目三</li>
    </ol>

    <dl>
        <dt>服务中心</dt>
            <dd>申请售后</dd>
            <dd>售后政策</dd>

        <dt>线下门店</dt>    
            <dd>小米之家</dd>
            <dd>服务网点</dd>

        <dt>关于小米</dt>
            <dd>了解小米</dd>
            <dd>加入小米</dd>    
    </dl>

</body>
</html>
