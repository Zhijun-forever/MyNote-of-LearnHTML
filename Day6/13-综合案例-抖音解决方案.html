<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合案例-抖音解决方案</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        li{
            list-style: none;
        }

        .box{
            
            border: 1px solid #ddd;
            /* 设置圆弧角 */
            border-radius: 8px;
            width: 1200px;
            height: 418px;
            /* 版心居中 */
            margin: 50px auto;

        }

        .box ul{
            /* 里边有四个li,所以使用flex并前自动换行 */
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-content: space-between;
            height: 418px;
            padding: 99px 40px 90px 60px;
        }
        
        .box li{
            /* 每个里里边有一张照片和一段文字所以使用flex让他们在一行 */
            display: flex;
            width: 500px;
            height: 88px;
           
          
        }

        .box .pic{
            /* 图片和文字存在间隙 */
            margin-right: 15px;
        }

        .box .text h4{
            line-height: 40px;
            color: #333;
        }
        
        .box .text p{
            font-size: 14px;
            color: #666;
            
        }

        .box img{
            width: 88px;
            height: 88px;
            
        }



    </style>


</head>
<body>
    <div class="box">
        <ul>
            <li>
                <div class="pic">
                    <img src="../Images/Day6综合案例/1.png" alt="">
                </div>
                <div class="text">
                    <h4>一键发布到多端</h4>
                    <p>发布短视频到抖音短视频，西瓜视频以及今日头条</p>
                </div>
            </li>


            <li>
                <div class="pic">
                    <img src="../Images/Day6综合案例/2.png" alt="">
                </div>
                <div class="text">
                    <h4>管理视频内容</h4>
                    <p>支持修改已发布稿件状态和实时查询视频审核状态</p>
                </div>
            </li>

            <li>
                <div class="pic">
                    <img src="../Images/Day6综合案例/3.png" alt="">
                </div>
                <div class="text">
                    <h4>发布携带组件</h4>
                    <p>支持分享内容携带小程序，地理位置信息等组件，拓展内容及突出地域性</p>
                </div>
            </li>


            <li>
                <div class="pic">
                    <img src="../Images/Day6综合案例/4.png" alt="">
                </div>
                <div class="text">
                    <h4>数据评估分析</h4>
                    <p>获取视频在对应产品内的数据表现，获取抖音热点，即使进行表现评估</p>
                </div>
           </li>
        </ul>
    </div>
</body>
</html>
