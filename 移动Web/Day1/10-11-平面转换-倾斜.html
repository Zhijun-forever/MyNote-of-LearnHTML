<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        div{

            width: 100px;
            height: 200px;
            margin: 100px auto;

            background-color: pink;
            transition: all 0.5s;
        }

        div:hover{
            transform: skew(-45deg);
        }

    </style>
</head>
<body>

    <div></div>

    <script>
        /**
         *      transform:skew()
         * 
         *      取值:
         *          角度单位deg
         *          正数:逆时针
         *          负数:顺时针
         * 
         **/
    </script>
</body>
</html>
