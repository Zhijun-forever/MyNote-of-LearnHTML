<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            background-color: green;
            background-image: linear-gradient(
                /* to right, */
                /* 45deg, */
                red 80%,
                green
            );
        }

    </style>

</head>
<body>

    <div></div>
    
    <script>
        /**
         *  渐变:颜色的逐渐变换的效果,
         *  有  线性渐变  
         *  和  径向渐变(中心点开始向四周变换) 两种效果
         * 
         *   线性渐变:
         *      background-image:linear-gradient(
         *          渐变方向,
         *          颜色1  终点位置,
         *          颜色2  终点位置
         *          ......
         *      );
         * 
         *      取值:
         *          渐变方向:可选!!
         *              to  方位名词
         *              角度度数
         *          终点位置:可选!!
         *              百分比
         * 
         * ==============================================
         * 
         *      径向渐变：
         *          background-image:radial-gradient(
         *              半径  at  圆心位置,
         *              颜色1  终点位置,
         *              颜色2  终点位置,
         *              ......   
         *          );
         * 
         *       取值：
         *          半径可以是2条，则为椭圆
         *          圆心位置取值：像素单位数值/百分比/方位名词
         * 
         **/

    </script>
</body>
</html>
