<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        
        img{
            transition: all 0.5s;
        }

        img:hover{
            transform: rotate(360deg);
        }

    </style>
</head>
<body>

    <img src="../../Images/01.jpg" alt="">

    <script>
        /**
         *      transform: rotate(旋转角度)
         * 
         *      这里角度单位是deg
         *      取值正负均可
         *      正：顺时针
         *      负：逆时针
         * 
         **/

    </script>
</body>
</html>
