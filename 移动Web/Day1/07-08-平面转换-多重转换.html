<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 800px;
            height: 200px;
            border: 1px solid #000;
            overflow: hidden;
            
        }

        img{
            width: 200px;
            transition: all 5s;
            
        }

        .box:hover img{
            /* 先平移 再旋转 才能实现边走边转的效果 */
            transform: translate(600px) rotate(360deg);
            /* transform: rotate(360deg) translate(600px); */


            /* 先旋转 再平移 会改变坐标轴向 ，在旋转时移动导致*/
            /* 多重转换： 以第一种转换形态的坐标轴为准 */
        }

    </style>

</head>
<body>
    
    <div class="box">
        <img src="../../Images/01.jpg" alt="">
    </div>


    <script>
        /**
         *  跳过了上一个案例
         *  
         * 
         *  先平移再旋转
         *  transform：translate() rotate();
         **/

    </script>
</body>
</html>
