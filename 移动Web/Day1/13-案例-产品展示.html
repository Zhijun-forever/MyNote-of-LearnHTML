<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品展示效果</title>
    <style>
        .box{
            /* overflow: hidden; */
            position: relative;
            width: 300px;
            height: 212px;
        }

        .box img{
            width: 300px;
            height: 212px;
        }

        .box .title{
            position: absolute;
            left: 15px;
            bottom: 10px;
            z-index: 2;
            width: 260px;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
        }
        
        .mask{
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 1;

            background-image: linear-gradient(
                /* 顶部完全透明，底部半透明黑色 */
                transparent,
                rgba(0,0,0,0.5)
            );
            opacity: 0;
            transition: all 0.5s;
        }

        .box:hover .mask{
            opacity: 1;
        }

    </style>


</head>
<body>
    <div class="box">
        <img src="../../Images/01.jpg" alt="">
        <div class="title">Oceanstor Pacific 海量存储斩获2021 Interop金奖</div>
        <div class="mask"></div>
    </div>
</body>
</html>
