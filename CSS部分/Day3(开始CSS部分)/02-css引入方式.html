<!-- 行内样式：配合JavaScript使用 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css引入方式</title>
    <link rel="stylesheet" href="../CSS/01.css">
</head>
<body>
    <button>Button</button>
    <!-- style里边写的是css的属性 -->
    <div style="color: red;font-size:20px;">这是div标签</div>
</body>
</html>
