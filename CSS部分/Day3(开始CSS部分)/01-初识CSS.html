<!-- 层叠样式表CSS，是一种样式表语言，用来描述HTML文档的呈现 -->
<!-- 书写位置：title标签下方添加style双标签，style标签里面书写CSS代码 -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初识CSS</title>
    <style>
    /*css代码
      选择器{css属性}
      属性名和属性值成对出现
    */


    p{
        color:rgb(0, 255, 187);
        font-size: 100px;
    }
    </style>


</head>
<body>
    <p>体验CSS</p>
</body>
</html>
