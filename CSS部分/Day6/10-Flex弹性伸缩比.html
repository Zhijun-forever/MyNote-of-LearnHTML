<!-- 
 
左右：控制弹性盒子的主轴方向的尺寸

属性名：flex

属性值：整数数字，表示占用父级剩余尺寸的份数

-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex弹性伸缩比</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
        }

        /* 默认情况下，或者未设置大小时，主轴方向尺寸是靠内容撑开；侧轴默认拉伸 */
        .box{
            display: flex;
            /* 设置主轴方向为垂直方向 */
            flex-direction: column;
            height: 300px;
            border:1px  solid #000;
        }

        .box div{
            height: 100px;
            background-color: pink;
        }

        .box div:nth-child(1){
            width: 200px;
        }

        .box div:nth-child(2){
            /* 表示占用父级剩余尺寸的份数 */
            flex: 1;
        }
        .box div:nth-child(3){
            /* 表示占用父级剩余尺寸的份数 */
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="box">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>
</body>
</html>
