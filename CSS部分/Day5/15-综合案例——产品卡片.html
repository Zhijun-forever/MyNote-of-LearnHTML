3.圆角，阴影等修饰属性

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合案例——产品卡片</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: #f1f1f1;
        }

        .product{
            margin:50px auto;
            width: 270px;
            height: 253px;
            background-color: #fff;
            text-align: center;
            padding: 40px;

            border-radius: 10px;
            
        }

        .product:hover{
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .product h4 {
            margin-top:20px;
            margin-bottom: 12px;
            color: #333;
            font-size: 18px;
            font-weight: 400;
        }

        .product p{
            font-size: 12px;
            color: #555;
        }

    </style>
</head>
<body>
    <div class="product">
        <img src="../Images/Day5-综合案例-liveSDK.png" alt="图标">
        <h4>抖音直播SDK</h4>
        <p>包含抖音直播快播功能</p>
    </div>
</body>
</html>
