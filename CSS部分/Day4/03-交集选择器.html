<!-- 
交集选择器：选择同时满足多个选择器条件的元素
语法：selector1.selector2
示例：
<div class="box red"></div> 

-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交集选择器</title>
    <style>
        p.box{
            color: red;
        }
    </style>
</head>
<body>
    <p>这是一个普通的段落元素</p>
    <p class="box">这是一个段落元素</p>
</body>
</html>
