<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emmet写法</title>
</head>
<body>
    <!-- 
    Emmet写法：一种快速编写HTML和CSS代码的工具，使用简洁的语法来生成复杂的代码结构。
    例如：
    div>ul>li*3
    上面代码中，div是父元素，ul是div的子元素，li*3表示在ul中创建三个li元素。
    生成的HTML代码如下：
    <div>
        <ul>
            <li></li>
            <li></li>
            <li></li>
        </ul>
    </div>

    Emmet还支持其他功能，如类选择器、ID选择器、属性设置等，使得编写HTML和CSS更加高效和便捷。

     -->
</body>
</html>
