<!-- 
网页中的背景属性可以设置元素的背景颜色、背景图片、背景位置、背景重复方式等。常用的背景属性包括： 
1. background-color：设置元素的背景颜色。
2. background-image：设置元素的背景图片。
3. background-position：设置背景图片的位置。
4. background-repeat：设置背景图片的重复方式。
5. background-size：设置背景图片的大小。
6. background-attachment：设置背景图片是否随页面滚动。
7. background-origin：设置背景图片的位置参考点。
8. background-clip：设置背景图片的裁剪区域。
例如：
```cssbody {
  background-color: #f0f0f0; /* 设置背景颜色 */
  background-image: url('background.jpg'); /* 设置背景图片 */
  background-position: center; /* 设置背景图片位置 */
  background-repeat: no-repeat; /* 设置背景图片不重复 */
  background-size: cover; /* 设置背景图片覆盖整个元素 */
}
-->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背景图</title>
    <style>
      div{
        /* 背景图默认平铺效果，如果图片太大会一直重复 */
        width: 1200px;
        height: 1200px;
        background-image: url(../Images/刘慈欣.png);
      }
    </style>

</head>
<body>
    <div>div标签</div>
</body>
</html>
