<!-- 文本格式化b标签,双标签 -->
<!-- 为文本添加特殊格式,加粗,倾斜,下划线,删除线等 -->
<!--
strong   加粗       b        加粗
em       倾斜       i        倾斜
ins      下划线     u        下划线
del      删除线     s        删除线
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本格式化标签</title>
</head>
<body>
    <b>b加粗 </b>
    <strong>strong加粗</strong>

    <br>
    <hr>

    <em>em倾斜 </em>
    <i>i倾斜</i>

    <br>
    <hr>

    <ins>ins下划线 </ins>
    <u>u下划线</u>

    <br>
    <hr>

    <del>del删除线 </del>
    <s>s删除线</s>

</body>
</html>
