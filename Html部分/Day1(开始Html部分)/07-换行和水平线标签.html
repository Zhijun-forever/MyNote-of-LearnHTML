<!-- 换行:<br> (这是单标签) -->
<!-- 浏览器不支持Enter键换行 -->


<!-- 水平线:<hr> (单标签) -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>换行与水平标签</title>
</head>
<body>
    <h1>这是一个标题</h1>
    第一行内容<br>第二行内容<br>
    <hr>
    <hr>
    <hr>
    第一行内容
    第二行内容


</body>
</html>
