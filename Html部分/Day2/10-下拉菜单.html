<!-- 标签：select嵌套option，select是下拉菜单整体，option是下拉菜单的每一项 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下拉菜单</title>
</head>
<body>
    城市：
    <select>
        <option>北京</option>
        <option>上海</option>
        <option>广东</option>
        <option>深圳</option>
        <option selected>长沙</option>
            
       
        

    </select>
</body>
</html>
