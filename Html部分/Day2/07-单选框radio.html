
<!-- 
属性名     特殊说明
name       控件说明,同组只能选中一个(单选功能)        <input type="text" name="gender" checked>男
checked    默认选中,属性名和属性值相同简写为一个单词   <input type="radip" name="gender">女 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单选框radio</title>
</head>
<body>
    性别:
    <input type="radio" name="gender" checked>男
    <input type="radio" name="gender">女 
</body>
</html>
