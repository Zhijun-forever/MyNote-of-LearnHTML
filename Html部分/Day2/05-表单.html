<!-- 作用：一般用于收集用户信息，比如登录页面，注册页面等-->
<!-- 可以使用用户键盘输入和鼠标点击 -->


<!--  


格式：
<input type="属性值">

tpye属性值      说明
text        文本框，用于输入单行文本
password    密码框
radio       单选框
chexkbox    多选框
file        上传文件
-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单</title>
</head>
<body>
    文本框：<input type="text">
    <br>
    密码框：<input type="password">
    <br>
    单选框：<input type="radio">
    <br>
    多选框：<input type="checkbox">
    <br>
    上传文件：<input type="file" name="" id="">


</body>
</html>
