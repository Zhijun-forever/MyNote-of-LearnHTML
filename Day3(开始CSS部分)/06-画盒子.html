<!-- 目标:使用合适的选择器画盒子 -->

<!--  
width    : 盒子宽度
height   : 盒子高度
background-color : 盒子背景颜色
-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画盒子</title>
    <style>
       .red{
            width: 100px;
            height: 100px;
            background-color: rgb(166, 14, 14);
       }
       .yellow{
            width: 100px;
            height: 100px;
            background-color: rgb(105, 105, 38);
       }
       .orange{
            width: 100px;
            height: 100px;
            background-color: rgb(255, 165, 0);
       }
    </style>

</head>
<body>
    <div class="red">div1</div>
    <div class="yellow">div2</div>
    <div class="orange">div3</div>
</body>
</html>
